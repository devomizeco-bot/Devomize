    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          window.WebSocket = function (url, protocols) {
            if (
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')))
            ) {
              const fakeWs = new EventTarget();
              fakeWs.url = url;
              fakeWs.readyState = 1;
              fakeWs.OPEN = 1;
              fakeWs.CLOSED = 3;
              fakeWs.CLOSING = 2;
              fakeWs.CONNECTING = 0;
              fakeWs.send = function () {};
              fakeWs.close = function () {};
              setTimeout(() => {
                fakeWs.dispatchEvent(new Event('open'));
              }, 0);
              return fakeWs;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CONNECTING = 0;
        }

        const origError = console.error;
        console.error = function (...args) {
          if (
            args.some(
              (a) =>
                typeof a === 'string' &&
                (a.includes('WebSocket') || a.includes('closed without opened') || a.includes('[vite] failed to connect'))
            )
          ) {
            return;
          }
          origError.apply(console, args);
        };

        window.addEventListener('error', function (e) {
          if (e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });

        window.addEventListener('unhandledrejection', function (e) {
          if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('closed without opened'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>
  <body class="bg-neutral-50 dark:bg-black text-neutral-900 dark:text-neutral-100 antialiased selection:bg-neutral-800 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
